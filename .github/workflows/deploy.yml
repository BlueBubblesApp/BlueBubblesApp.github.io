name: Deploy to GitHub Pages

on:
  push:
    # NOTE: this repository's default branch is `master`, not `main`.
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight production deploy; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx astro check

      - name: Build
        run: npx astro build

      - name: Verify critical files and URL preservation
        run: node scripts/verify-build.mjs

      # Skips automatically once the legacy .html files are removed.
      - name: Verify original copy survived
        run: node scripts/verify-content.mjs

      # NOT actions/upload-pages-artifact: it tars with `--exclude=.[^/]*`,
      # which silently drops every dot-entry -- including
      # .well-known/org.flathub.VerifiedApps.txt, the file Flathub reads to keep
      # the app verified. Building the tar here keeps hidden files. The layout
      # (an artifact named `github-pages` containing `artifact.tar`) is what
      # actions/deploy-pages expects.
      - name: Package the site, hidden files included
        run: tar --dereference --hard-dereference -cf "$RUNNER_TEMP/artifact.tar" -C ./dist .

      - name: Verify the packaged artifact still carries the dot-entries
        run: |
          set -euo pipefail
          tar -tf "$RUNNER_TEMP/artifact.tar" | grep -q './.well-known/org.flathub.VerifiedApps.txt' \
            || { echo "::error::Flathub verification file missing from the deploy artifact"; exit 1; }
          echo "✓ .well-known present in the artifact"

      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
